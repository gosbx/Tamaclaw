<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tamaclaw</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./skins.css" />
  <script src="/vendor/chart.umd.js"></script>
</head>
<body>
  <main id="stage">
    <section id="pet-zone">
      <div id="character-root"></div>
      <div id="speech-bubble" class="hidden"><span id="speech-text"></span></div>
    </section>
    <section id="show-stage" class="hidden"></section>
    <aside id="dashboard" class="hidden">
      <div id="widget-slot"></div>
      <nav id="widget-dots"></nav>
    </aside>
  </main>
  <div id="toasts"></div>
  <div id="skin-picker" class="hidden">
    <div class="sp-title">CHOOSE YOUR PET · tap to preview live</div>
    <div class="sp-row" id="sp-row"></div>
    <button id="sp-confirm">✓ keep this one</button>
  </div>
  <button id="skin-gear" title="change pet (s)">⚙ skin</button>
  <footer id="statusbar">
    <span id="conn-dot" class="dot offline"></span>
    <span id="conn-label">connecting…</span>
    <span id="clock"></span>
  </footer>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
